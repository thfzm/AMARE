<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AMARE Frame Permission Child</title></head>
<body>
<h1>AMARE Frame Permission Child</h1>
<div id="status">waiting</div>
<script>
setTimeout(async () => {
  const status = document.getElementById('status');
  status.textContent = 'requesting-notify';
  try {
    const result = await Notification.requestPermission();
    status.textContent = 'notify-' + result;
  } catch (error) {
    status.textContent = 'notify-error';
  }
}, 1000);
</script>
</body>
</html>
