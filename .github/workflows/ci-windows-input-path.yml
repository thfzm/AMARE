name: ci-windows-input-path

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input-path:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      AMARE_GPUI_MESSAGE_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build GPUI application
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          cargo build --release --manifest-path apps/amare-gpui/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "GPUI build failed" }
      - name: Run input path probe
        shell: pwsh
        timeout-minutes: 15
        run: |
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          $status = Join-Path $env:RUNNER_TEMP "amare-gpui-input-path-status"
          $data = Join-Path $env:RUNNER_TEMP "amare-gpui-input-path-data"
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\diagnostics\0.86.0\input-path"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & "tools/gpui-input-path-probe.ps1" -Exe $exe -StatusDir $status -DataDir $data -OutDir $out -Trials 3
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "input path probe failed with exit code $LASTEXITCODE" }
      - name: Upload input path probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-input-path-${{ github.run_id }}
          path: artifacts/windows/diagnostics/0.86.0/input-path/**
