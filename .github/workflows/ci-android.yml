name: ci-android

# Phase 5 scaffold. Android-related changes trigger validation; manual dispatch
# remains available for ad-hoc checks.
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/ci-android.yml"

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Generate wrapper
        working-directory: apps/android
        run: gradle wrapper
      - name: Test and assemble debug
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: amare-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            apps/android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
            apps/android/app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
