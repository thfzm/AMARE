name: ci-android

# Phase 5 scaffold. Android-related changes trigger validation; manual dispatch
# remains available for ad-hoc checks.
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/ci-android.yml"

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Generate wrapper
        working-directory: apps/android
        run: gradle wrapper
      - name: Assemble debug
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug
