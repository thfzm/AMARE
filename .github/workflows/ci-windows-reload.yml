name: ci-windows-reload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reload:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      AMARE_GPUI_MESSAGE_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build GPUI application
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          cargo build --release --manifest-path apps/amare-gpui/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "GPUI build failed" }
      - name: Run reload and multi-window probe
        shell: pwsh
        timeout-minutes: 15
        run: |
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          $status = Join-Path $env:RUNNER_TEMP "amare-gpui-reload-status"
          $data = Join-Path $env:RUNNER_TEMP "amare-gpui-reload-data"
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\diagnostics\0.91.0\reload"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $fixtureA = "http://127.0.0.1:8772/fixture-a.html"
          $fixtureB = "http://127.0.0.1:8772/fixture-b.html"
          $server = Start-Process python -ArgumentList @("-m","http.server","8772","--directory","apps/amare-gpui/test-page") -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              try { $r = Invoke-WebRequest -Uri $fixtureA -UseBasicParsing -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ready = $true; break } } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw "local fixture server did not become ready" }
            & "tools/gpui-reload-probe.ps1" -Exe $exe -StatusDir $status -DataDir $data -OutDir $out -FixtureA $fixtureA -FixtureB $fixtureB -Reloads 10
            if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "reload probe failed with exit code $LASTEXITCODE" }
          } finally {
            if ($null -ne $server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Upload reload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-reload-${{ github.run_id }}
          path: artifacts/windows/diagnostics/0.91.0/reload/**
