name: ci-windows-enter-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enter-probe:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      AMARE_GPUI_MESSAGE_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build GPUI application
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          cargo build --release --manifest-path apps/amare-gpui/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "GPUI build failed" }
      - name: Run Enter probe
        shell: pwsh
        timeout-minutes: 12
        run: |
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          $status = Join-Path $env:RUNNER_TEMP "amare-gpui-enter-status"
          $data = Join-Path $env:RUNNER_TEMP "amare-gpui-enter-data"
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\diagnostics\0.84.0\enter-probe"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & "tools/gpui-enter-probe.ps1" -Exe $exe -StatusDir $status -DataDir $data -OutDir $out -Iterations 5
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Enter probe failed with exit code $LASTEXITCODE" }
      - name: Upload Enter probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-enter-probe-${{ github.run_id }}
          path: artifacts/windows/diagnostics/0.84.0/enter-probe/**
