name: ci-windows-gpui

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/amare-gpui/**'
      - 'tools/gpui-input-smoke.ps1'
      - 'tools/gpui-tab-smoke.ps1'
      - 'tools/gpui-library-smoke.ps1'
      - 'tools/gpui-download-smoke.ps1'
      - 'tools/gpui-settings-smoke.ps1'
      - 'tools/gpui-session-smoke.ps1'
      - 'tools/gpui-password-smoke.ps1'
      - 'tools/gpui-vault-multiwindow.ps1'
      - 'tools/slow_http_server.py'
      - 'tools/slow_session_server.py'
      - '.github/workflows/ci-windows-gpui.yml'
  pull_request:
    paths:
      - 'apps/amare-gpui/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpui-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build GPUI application
        shell: pwsh
        run: |
          cargo build --manifest-path apps/amare-gpui/Cargo.toml --release

      - name: Password vault unit tests
        shell: pwsh
        timeout-minutes: 8
        run: cargo test --manifest-path apps/amare-gpui/Cargo.toml --bin amare-gpui password_vault::tests -- --nocapture

      - name: GPUI password vault test
        shell: pwsh
        timeout-minutes: 20
        env:
          AMARE_GPUI_WINDOW_SIZE: "1044x788"
        run: |
          $server = Start-Process python -ArgumentList @("-m", "http.server", "8767", "--bind", "127.0.0.1", "--directory", "apps/amare-gpui/test-page") -PassThru
          try {
            $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
            $status = Join-Path $env:RUNNER_TEMP "amare-gpui-password-status.json"
            $data = Join-Path $env:RUNNER_TEMP "amare-gpui-password-data"
            $shots = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\screenshots\0.60.0"
            & "tools/gpui-password-smoke.ps1" -Exe $exe -Status $status -DataDir $data -ScreenshotDir $shots -LoginUrl "http://127.0.0.1:8767/login.html?tab=PW"
            if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "GPUI password smoke failed with exit code $LASTEXITCODE" }
          } finally {
            if ($null -ne $server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: GPUI vault multi-window integrity test
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 25
        env:
          AMARE_GPUI_WINDOW_SIZE: "1044x788"
        run: |
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          $status = Join-Path $env:RUNNER_TEMP "amare-gpui-vault-multiwindow-status"
          $data = Join-Path $env:RUNNER_TEMP "amare-gpui-vault-multiwindow-data"
          $shots = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\screenshots\0.60.0"
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          & "tools/gpui-vault-multiwindow.ps1" -Exe $exe -StatusDir $status -DataDir $data -ScreenshotDir $shots -LoginUrl "http://127.0.0.1:8767/login.html?tab=PW"
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "GPUI vault multiwindow smoke failed with exit code $LASTEXITCODE" }

      - name: Smoke launch GPUI application
        shell: pwsh
        timeout-minutes: 6
        run: |
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          if (-not (Test-Path $exe)) { throw "amare-gpui.exe missing" }
          $result = Join-Path $env:RUNNER_TEMP "amare-gpui-self-test.json"
          if (Test-Path $result) { Remove-Item $result -Force }
          $env:AMARE_GPUI_SELF_TEST = "1"
          $env:AMARE_GPUI_RESULT = $result
          $before = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
          $p = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $result) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            $p.Refresh()
            if ($p.HasExited) { throw "amare-gpui exited during self-test: $($p.ExitCode)" }
          }
          $p.Refresh()
          if ($p.HasExited) { throw "amare-gpui exited during self-test: $($p.ExitCode)" }
          $after = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
          Write-Host "GPUI process alive pid=$($p.Id) window=$($p.MainWindowHandle) webview2=$before->$after"
          if ($after -le $before) { throw "WebView2 child processes were not created" }
          if (-not (Test-Path $result)) { throw "GPUI self-test result was not produced" }
          $data = Get-Content $result -Raw | ConvertFrom-Json
          $data | ConvertTo-Json -Depth 6 | Write-Host
          if (-not $data.success) { throw "GPUI WebView2 self-test failed" }
          if ($data.source -notmatch "example\.com") { throw "GPUI WebView2 URL was not loaded" }
          if ($data.title -ne "Example Domain") { throw "GPUI WebView2 page title was not updated" }
          if (-not $data.back_navigation) { throw "GPUI WebView2 back navigation failed" }

          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class AmareWin32 { [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; } [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect); [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hWnd, IntPtr after, int x, int y, int cx, int cy, uint flags); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd); }'
          Start-Sleep -Seconds 3
          $p.Refresh()
          $hwnd = $p.MainWindowHandle
          if ($hwnd -eq [IntPtr]::Zero) { throw "GPUI window handle missing at screenshot time" }
          $dir = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\handle-forensics"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $rect = New-Object AmareWin32+RECT
          [void][AmareWin32]::GetWindowRect($hwnd, [ref]$rect)
          $w = [Math]::Max(1, $rect.Right - $rect.Left)
          $h = [Math]::Max(1, $rect.Bottom - $rect.Top)
          $bmp = New-Object System.Drawing.Bitmap($w, $h)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bmp.Size)
          $shot = Join-Path $dir "gpui-window.png"
          $bmp.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          if ((Get-Item $shot).Length -lt 1000) {
            [void][AmareWin32]::SetForegroundWindow($hwnd)
            Start-Sleep -Seconds 2
            [void][AmareWin32]::GetWindowRect($hwnd, [ref]$rect)
            $w = [Math]::Max(1, $rect.Right - $rect.Left); $h = [Math]::Max(1, $rect.Bottom - $rect.Top)
            $bmp = New-Object System.Drawing.Bitmap($w, $h)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bmp.Size)
            $bmp.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          if ((Get-Item $shot).Length -lt 1000) { Write-Warning "GPUI smoke screenshot was empty after retry" }
          Write-Host "GPUI screenshot=$shot bytes=$((Get-Item $shot).Length) size=${w}x${h}"

          [void][AmareWin32]::SetWindowPos($hwnd, [IntPtr]::Zero, $rect.Left, $rect.Top, 960, 700, 0x0004)
          Start-Sleep -Seconds 2
          $rect2 = New-Object AmareWin32+RECT
          [void][AmareWin32]::GetWindowRect($hwnd, [ref]$rect2)
          $w2 = [Math]::Max(1, $rect2.Right - $rect2.Left)
          $h2 = [Math]::Max(1, $rect2.Bottom - $rect2.Top)
          $bmp2 = New-Object System.Drawing.Bitmap($w2, $h2)
          $g2 = [System.Drawing.Graphics]::FromImage($bmp2)
          $g2.CopyFromScreen($rect2.Left, $rect2.Top, 0, 0, $bmp2.Size)
          $shot2 = Join-Path $dir "gpui-window-resized.png"
          $bmp2.Save($shot2, [System.Drawing.Imaging.ImageFormat]::Png)
          $g2.Dispose(); $bmp2.Dispose()
          Write-Host "GPUI resized screenshot=$shot2 bytes=$((Get-Item $shot2).Length) size=${w2}x${h2}"

          [void][AmareWin32]::SetForegroundWindow($hwnd)
          [System.Windows.Forms.SendKeys]::SendWait("%{F4}")
          if (-not $p.WaitForExit(15000)) { throw "GPUI did not exit after Alt+F4" }
          Start-Sleep -Seconds 2
          $afterClose = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
          Write-Host "GPUI graceful exit code=$($p.ExitCode) webview2=$before->$afterClose"
          if ($afterClose -gt $before) { throw "WebView2 child processes remained after GPUI exit" }

      - name: Activate Korean IME profile
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 4
        run: |
          $languages = Get-WinUserLanguageList
          if (-not ($languages | Where-Object LanguageTag -like 'ko*')) {
            $korean = (New-WinUserLanguageList ko-KR)[0]
            $languages = @($korean) + @($languages | Where-Object LanguageTag -notlike 'ko*')
            Set-WinUserLanguageList -LanguageList $languages -Force
          }
          try {
            Set-WinDefaultInputMethodOverride -InputTip '0412:{A028AE76-01B1-46C2-99C4-ACD9858AE02F}{B5FE1F02-D5F2-4445-9C03-C568F23C99A1}'
          } catch {
            Write-Warning "Korean default IME override failed: $($_.Exception.Message)"
          }
          Get-WinUserLanguageList | Format-List | Out-Host
          Get-WinDefaultInputMethodOverride | Format-List | Out-Host

      - name: GPUI input and Korean IME test
        shell: pwsh
        timeout-minutes: 15
        env:
          AMARE_GPUI_RESTORE: "0"
          AMARE_GPUI_WINDOW_SIZE: "1044x788"
        run: |
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          $status = Join-Path $env:RUNNER_TEMP "amare-gpui-input-status.json"
          $data = Join-Path $env:RUNNER_TEMP "amare-gpui-input-data"
          $env:AMARE_GPUI_DATA_DIR = $data
          $dir = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\handle-forensics"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $page = (Resolve-Path "apps/amare-gpui/test-page/index.html").Path -replace '\\', '/'
          $baseUrl = "file:///$page"
          Write-Host "GPUI test page: $baseUrl"
          & "tools/gpui-input-smoke.ps1" -Exe $exe -Status $status -BaseUrl $baseUrl -ArtifactDir $dir
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "GPUI input smoke failed with exit code $LASTEXITCODE" }

      - name: GPUI multi-tab lifecycle test
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 20
        env:
          AMARE_GPUI_RESTORE: "0"
          AMARE_GPUI_WINDOW_SIZE: "1044x788"
        run: |
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          $status = Join-Path $env:RUNNER_TEMP "amare-gpui-tab-status.json"
          $data = Join-Path $env:RUNNER_TEMP "amare-gpui-tab-data"
          $env:AMARE_GPUI_DATA_DIR = $data
          $dir = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\handle-forensics"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $page = (Resolve-Path "apps/amare-gpui/test-page/index.html").Path -replace '\\', '/'
          $baseUrl = "file:///$page"
          & "tools/gpui-tab-smoke.ps1" -Exe $exe -Status $status -BaseUrl $baseUrl -ArtifactDir $dir
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "GPUI tab smoke failed with exit code $LASTEXITCODE" }

      - name: GPUI bookmarks and history test
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          $status = Join-Path $env:RUNNER_TEMP "amare-gpui-library-status.json"
          $data = Join-Path $env:RUNNER_TEMP "amare-gpui-library-data"
          $downloads = Join-Path $env:RUNNER_TEMP "amare-gpui-downloads"
          $shots = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\screenshots\0.60.0"
          New-Item -ItemType Directory -Force -Path $shots, $downloads | Out-Null
          $downloadFile = Join-Path (Resolve-Path "apps/amare-gpui/test-page").Path "download-test.bin"
          [IO.File]::WriteAllBytes($downloadFile, (New-Object byte[] (5 * 1024 * 1024)))
          $server = Start-Process python -ArgumentList @("tools/slow_http_server.py", "apps/amare-gpui/test-page", "8765") -PassThru
          try {
            Start-Sleep -Seconds 2
            $env:AMARE_GPUI_DOWNLOAD_DIR = $downloads
            & "tools/gpui-library-smoke.ps1" -Exe $exe -Status $status -DataDir $data -ScreenshotDir $shots -BaseUrl "http://127.0.0.1:8765/index.html"
            if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "GPUI library smoke failed with exit code $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: GPUI download manager test
        shell: pwsh
        timeout-minutes: 10
        env:
          AMARE_GPUI_RESTORE: "0"
        run: |
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          $status = Join-Path $env:RUNNER_TEMP "amare-gpui-download-status.json"
          $data = Join-Path $env:RUNNER_TEMP "amare-gpui-download-data"
          $downloads = Join-Path $env:RUNNER_TEMP "amare-gpui-download-files"
          $shots = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\screenshots\0.60.0"
          & "tools/gpui-download-smoke.ps1" -Exe $exe -Status $status -DataDir $data -DownloadDir $downloads -ScreenshotDir $shots
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "GPUI download smoke failed with exit code $LASTEXITCODE" }

      - name: GPUI settings and multi-window test
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        env:
          AMARE_GPUI_WINDOW_SIZE: "1044x788"
        run: |
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          $status = Join-Path $env:RUNNER_TEMP "amare-gpui-settings-status.json"
          $data = Join-Path $env:RUNNER_TEMP "amare-gpui-settings-data"
          $shots = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\screenshots\0.60.0"
          & "tools/gpui-settings-smoke.ps1" -Exe $exe -Status $status -DataDir $data -ScreenshotDir $shots
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "GPUI settings smoke failed with exit code $LASTEXITCODE" }

      - name: GPUI session restore and failure test
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        env:
          AMARE_GPUI_WINDOW_SIZE: "1044x788"
        run: |
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          $status = Join-Path $env:RUNNER_TEMP "amare-gpui-session-status.json"
          $data = Join-Path $env:RUNNER_TEMP "amare-gpui-session-data"
          $shots = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\screenshots\0.60.0"
          & "tools/gpui-session-smoke.ps1" -Exe $exe -Status $status -DataDir $data -ScreenshotDir $shots -Port 8772
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "GPUI session smoke failed with exit code $LASTEXITCODE" }

      - name: Address bar actual input test
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 5
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class AmareWin32 { [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; } [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd); [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, IntPtr extra); }'
          $exe = "apps/amare-gpui/target/release/amare-gpui.exe"
          $status = Join-Path $env:RUNNER_TEMP "amare-gpui-address-status.json"
          if (Test-Path $status) { Remove-Item $status -Force }
          $env:AMARE_GPUI_SELF_TEST = "0"
          $env:AMARE_GPUI_STATUS = $status
          $before = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
          $p = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $status) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $status)) { throw "GPUI status file was not produced" }
          Start-Sleep -Seconds 2
          $p.Refresh()
          $hwnd = $p.MainWindowHandle
          if ($hwnd -eq [IntPtr]::Zero) { throw "GPUI window handle missing for address test" }
          $rect = New-Object AmareWin32+RECT
          [void][AmareWin32]::GetWindowRect($hwnd, [ref]$rect)
          [void][AmareWin32]::SetForegroundWindow($hwnd)
          [void][AmareWin32]::SetCursorPos($rect.Left + 360, $rect.Top + 68)
          [AmareWin32]::mouse_event(0x0002, 0, 0, 0, [IntPtr]::Zero)
          [AmareWin32]::mouse_event(0x0004, 0, 0, 0, [IntPtr]::Zero)
          Start-Sleep -Milliseconds 250
          [System.Windows.Forms.SendKeys]::SendWait("^l")
          Start-Sleep -Milliseconds 250
          for ($i = 0; $i -lt 40; $i++) { [System.Windows.Forms.SendKeys]::SendWait("{BACKSPACE}") }
          [System.Windows.Forms.SendKeys]::SendWait("https://example.com/?amare=address")
          Start-Sleep -Milliseconds 500
          $typed = if (Test-Path $status) { Get-Content $status -Raw | ConvertFrom-Json } else { $null }
          Write-Host "GPUI address typed address=$($typed.address) source=$($typed.source)"
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          $deadline = (Get-Date).AddSeconds(20)
          $data = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
            if (Test-Path $status) {
              $data = Get-Content $status -Raw | ConvertFrom-Json
              if ($data.source -match "^https://example\.com/\?amare=address") { break }
            }
          }
          if ($null -eq $data -or $data.source -notmatch "^https://example\.com/\?amare=address") { throw "GPUI address bar input did not navigate to exact requested URL: source=$($data.source) address=$($data.address)" }
          $shot = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\handle-forensics\gpui-address-input.png"
          $bmp = New-Object System.Drawing.Bitmap(($rect.Right-$rect.Left), ($rect.Bottom-$rect.Top))
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bmp.Size)
          $bmp.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Write-Host "GPUI address navigation PASS source=$($data.source) title=$($data.title) screenshot=$shot"
          [void][AmareWin32]::SetForegroundWindow($hwnd)
          [System.Windows.Forms.SendKeys]::SendWait("%{F4}")
          if (-not $p.WaitForExit(15000)) { throw "GPUI address test app did not exit" }
          Start-Sleep -Seconds 2
          $after = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
          if ($after -gt $before) { throw "WebView2 processes remained after address test exit" }

      - name: GPUI suite failure gate
        if: always()
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\handle-forensics\gpui-tab-results.json"),
            (Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\screenshots\0.60.0\gpui-library-results.json"),
            (Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\screenshots\0.60.0\gpui-settings-results.json"),
            (Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\screenshots\0.60.0\gpui-session-results.json"),
            (Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\screenshots\0.60.0\gpui-password-results.json"),
            (Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\screenshots\0.60.0\gpui-vault-multiwindow-results.json")
          )
          $failed = 0
          $unverified = 0
          foreach ($path in $paths) {
            if (-not (Test-Path $path)) { Write-Host "MISSING result file: $path"; $failed++; continue }
            $data = Get-Content $path -Raw | ConvertFrom-Json
            Write-Host "$(Split-Path $path -Leaf): PASS=$($data.pass) FAIL=$($data.fail) UNVERIFIED=$($data.unverified)"
            $failed += [int]$data.fail
            $unverified += [int]$data.unverified
          }
          Write-Host "GPUI aggregate FAIL=$failed UNVERIFIED=$unverified"
          if ($failed -gt 0) { throw "GPUI suite contains $failed FAIL result(s); see result JSON files" }

      - name: Upload GPUI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-windows-${{ github.run_id }}
          path: |
            apps/amare-gpui/target/release/amare-gpui.exe
            artifacts/windows/handle-forensics/gpui-window.png
            artifacts/windows/handle-forensics/gpui-window-resized.png
            artifacts/windows/handle-forensics/gpui-address-input.png
            artifacts/windows/handle-forensics/gpui-ctrl-l-from-page.png
            artifacts/windows/handle-forensics/gpui-korean-address.png
            artifacts/windows/handle-forensics/gpui-final-input-state.png
            artifacts/windows/handle-forensics/gpui-input-failure.png
            artifacts/windows/handle-forensics/gpui-input-results.json
            artifacts/windows/handle-forensics/gpui-tabs-10.png
            artifacts/windows/handle-forensics/gpui-tabs-after-close.png
            artifacts/windows/handle-forensics/gpui-tabs-failure.png
            artifacts/windows/handle-forensics/gpui-tab-results.json
            ${{ runner.temp }}/amare-gpui-tab-status.json
            ${{ runner.temp }}/amare-gpui-library-status.json
            ${{ runner.temp }}/amare-gpui-download-status.json
            artifacts/windows/screenshots/0.60.0/gpui-download-results.json
            artifacts/windows/screenshots/0.60.0/*.png
            artifacts/windows/screenshots/0.60.0/gpui-library-results.json
            artifacts/windows/screenshots/0.60.0/gpui-settings-results.json
            artifacts/windows/screenshots/0.60.0/gpui-password-results.json
            artifacts/windows/screenshots/0.60.0/gpui-session-results.json
            artifacts/windows/screenshots/0.60.0/gpui-vault-multiwindow-results.json
            ${{ runner.temp }}/amare-gpui-address-status.json
            ${{ runner.temp }}/amare-gpui-input-status.json
            ${{ runner.temp }}/amare-gpui-ime.log
          if-no-files-found: warn
