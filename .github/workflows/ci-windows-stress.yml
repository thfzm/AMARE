name: ci-windows-stress

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Stress duration in seconds
        required: false
        default: "1800"

permissions:
  contents: read

concurrency:
  group: ci-windows-stress
  cancel-in-progress: false

jobs:
  windows-stress:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $candidates = @()
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} "Microsoft\EdgeWebView\Application") }
          if ($env:ProgramFiles) { $candidates += (Join-Path $env:ProgramFiles "Microsoft\EdgeWebView\Application") }
          $found = $candidates | Where-Object { Test-Path $_ } | ForEach-Object {
            Get-ChildItem $_ -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue
          } | Select-Object -First 1
          if (-not $found) {
            $setup = Join-Path $env:TEMP "MicrosoftEdgeWebview2Setup.exe"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $setup
            Start-Process -FilePath $setup -ArgumentList "/silent /install" -Wait
          }
          $found = $candidates | Where-Object { Test-Path $_ } | ForEach-Object {
            Get-ChildItem $_ -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue
          } | Select-Object -First 1
          if (-not $found) { throw "WebView2 Runtime installation failed." }

      - name: Run Windows verification with stress
        shell: pwsh
        env:
          AMARE_VERIFY_OUTPUT: ${{ github.workspace }}\artifacts\windows
          AMARE_UI_STRESS_SECONDS: ${{ inputs.seconds }}
        run: |
          .\tools\verify-windows.ps1 -CI

      - name: Upload stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stress-${{ github.run_id }}
          path: artifacts/windows
          if-no-files-found: warn
