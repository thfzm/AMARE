<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AMARE Capture Test</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f4f7fb; color: #162033; }
    header { padding: 28px 36px; background: #173a6b; color: #ffffff; }
    h1 { margin: 0 0 8px; font-size: 34px; }
    main { padding: 28px 36px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card { padding: 22px; border-radius: 10px; color: #ffffff; font-size: 22px; font-weight: 700; }
    .red { background: #c0392b; }
    .green { background: #1e8449; }
    .blue { background: #2471a3; }
    p { font-size: 18px; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>AMARE CapturePreview</h1>
    <div>rendered DOM content, not a window chrome mockup</div>
  </header>
  <main>
    <div class="grid">
      <div class="card red">RED BLOCK</div>
      <div class="card green">GREEN BLOCK</div>
      <div class="card blue">BLUE BLOCK</div>
    </div>
    <p id="status">CapturePreview content marker: AMARE_059_CAPTURE_OK</p>
  </main>
</body>
</html>
